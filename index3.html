<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2>AN UNORDERED HTML LISTS</h2>
    <ul>
        <li>COFFEE</li>
        <li>TEA</li>
        <li>MILK</li>
    </ul>
    <h2>AN ORDERED LISTS</h2>
    <ol>
        <li>COFFEE</li>
        <li>TEA</li>
        <li>MILK</li>
    </ol>
</body>
</html>
