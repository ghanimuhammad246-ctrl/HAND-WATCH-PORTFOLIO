  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Interactive JavaScript Engine -->
  <script>
    function switchTab(element, tabName) {
      document.querySelectorAll('.nav-item-btn').forEach(link => {
        link.classList.remove('active', 'text-white');
        link.classList.add('text-white-50');
      });
      if (element) {
        element.classList.add('active', 'text-white');
        element.classList.remove('text-white-50');
      }
      document.querySelectorAll('.view-section').forEach(view => {
        view.classList.remove('active-view');
      });
      const pageTitle = document.getElementById('pageTitle');
      const pageSubtitle = document.getElementById('pageSubtitle');
      const headerActions = document.getElementById('headerActions');
      let viewId = 'dashboardView';
      if (tabName === 'Dashboard') {
        viewId = 'dashboardView';
        pageTitle.textContent = 'Dashboard';
        pageSubtitle.textContent = 'Overview of leads, sales, automations and team activity';
        headerActions.innerHTML = '<button class="btn btn-brand px-4 py-2 fw-semibold rounded-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#addLeadModal">+ Add Lead</button>';
      } else if (tabName === 'Leads') {
        viewId = 'leadsView';
        pageTitle.textContent = 'Leads';
        pageSubtitle.textContent = 'Manage prospects from every source in one place.';
        headerActions.innerHTML = '<button class="btn btn-brand px-4 py-2 fw-semibold rounded-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#addLeadModal">+ Add Lead</button>';
      } else if (tabName === 'Pipeline') {
        viewId = 'pipelineView';
        pageTitle.textContent = 'Sales Pipeline';
        pageSubtitle.textContent = 'Drag leads across stages as deals progress.';
        headerActions.innerHTML = '<button class="btn btn-brand px-4 py-2 fw-semibold rounded-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#newDealModal">+ New Deal</button>';
      } else if (tabName === 'Inbox') {
        viewId = 'inboxView';
        pageTitle.textContent = 'WhatsApp Inbox';
        pageSubtitle.textContent = 'Unified customer conversations with AI-assisted replies.';
        headerActions.innerHTML = ''; // No top-right button in Inbox
      } else if (tabName === 'AI Assistant') {
        viewId = 'aiAssistantView';
        pageTitle.textContent = 'AI Assistant';
        pageSubtitle.textContent = 'Ask your business agent to analyze leads and take actions.';
        headerActions.innerHTML = ''; // No top-right button in AI Assistant
      } else if (tabName === 'Automations') {
        viewId = 'automationsView';
        pageTitle.textContent = 'Automations';
        pageSubtitle.textContent = 'Build and manage lead, sales and support workflows.';
        headerActions.innerHTML = '<button class="btn btn-brand px-4 py-2 fw-semibold rounded-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#newAutomationModal">+ New Automation</button>';
      } else if (tabName === 'Analytics') {
        viewId = 'analyticsView';
        pageTitle.textContent = 'Analytics';
        pageSubtitle.textContent = 'Track acquisition, conversion and automation performance.';
        headerActions.innerHTML = '';
      } else if (tabName === 'Integrations') {
        viewId = 'integrationsView';
        pageTitle.textContent = 'Integrations';
        pageSubtitle.textContent = 'Connect communication, CRM, marketing and automation tools.';
        headerActions.innerHTML = '';
      } else if (tabName === 'Team') {
        viewId = 'teamView';
        pageTitle.textContent = 'Team & Tasks';
        pageSubtitle.textContent = 'Assign work, manage roles and monitor workload.';
        headerActions.innerHTML = '<button class="btn btn-brand px-4 py-2 fw-semibold rounded-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#inviteMemberModal">+ Invite Member</button>';
      } else if (tabName === 'Billing') {
        viewId = 'billingView';
        pageTitle.textContent = 'Billing & Plans';
        pageSubtitle.textContent = 'Manage subscription, usage and invoices.';
        headerActions.innerHTML = '';
      } else if (tabName === 'Settings') {
        viewId = 'settingsView';
        pageTitle.textContent = 'Settings';
        pageSubtitle.textContent = 'Configure company profile, AI behavior, notifications and security.';
        headerActions.innerHTML = '';
      } else {
        viewId = 'subView';
        pageTitle.textContent = tabName;
        pageSubtitle.textContent = `Manage and view options for ${tabName.toLowerCase()}`;
        headerActions.innerHTML = '';
        document.getElementById('subViewTitle').textContent = tabName + ' Section';
      }
      const viewToShow = document.getElementById(viewId);
      if (viewToShow) {
        viewToShow.classList.add('active-view');
      }
    }
    function openDashboard(e) {
      if (e) e.preventDefault();
      const firstNavBtn = document.querySelector('.nav-item-btn');
      switchTab(firstNavBtn, 'Dashboard');
    }
    function addLead(e) {
      e.preventDefault();
      const name = document.getElementById('leadName').value;
      const company = document.getElementById('leadCompany').value;
      const source = document.getElementById('leadSource').value;
      const status = document.getElementById('leadStatus').value;
      const value = parseInt(document.getElementById('leadValue').value).toLocaleString();
      const tableBody = document.getElementById('leadsTableBody');
      const newRow = document.createElement('tr');
      let badgeColor = 'text-primary border-primary-subtle';
      if (status === 'New') badgeColor = 'text-info border-info-subtle';
      if (status === 'Won') badgeColor = 'text-success border-success-subtle';
      const dashboardRowHtml = `
        <td class="ps-0 fw-bold text-dark">${name}</td>
        <td class="text-secondary">${company}</td>
        <td class="text-secondary">${source}</td>
        <td><span class="badge text-bg-light ${badgeColor} border fw-normal">${status}</span></td>
        <td class="text-end pe-0 fw-semibold text-dark">$${value}</td>
      `;
      const leadsRowHtml = `
        <td class="ps-0 fw-bold text-dark py-3">${name}</td>
        <td class="text-secondary py-3">${company}</td>
        <td class="text-secondary py-3">${source}</td>
        <td class="text-secondary py-3">You</td>
        <td class="py-3"><span class="badge text-bg-light ${badgeColor} border fw-normal">${status}</span></td>
        <td class="text-end pe-0 fw-semibold text-brand py-3">$${value}</td>
      `;
      const dashboardTableBody = document.getElementById('leadsTableBody');
      if (dashboardTableBody) {
        const newRow = document.createElement('tr');
        newRow.innerHTML = dashboardRowHtml;
        dashboardTableBody.prepend(newRow);
      }
      const leadsViewTableBody = document.getElementById('leadsViewTableBody');
      if (leadsViewTableBody) {
        const newRow = document.createElement('tr');
        newRow.innerHTML = leadsRowHtml;
        leadsViewTableBody.prepend(newRow);
      }
      document.getElementById('leadForm').reset();
      const modal = bootstrap.Modal.getInstance(document.getElementById('addLeadModal'));
      if (modal) modal.hide();
      showAlert('Lead added successfully!', 'success');
    }
    function addDeal(event) {
      event.preventDefault();
      const company = document.getElementById('dealCompany').value;
      const contact = document.getElementById('dealContact').value;
      const value = document.getElementById('dealValue').value;
      const newDealHtml = `
        <div class="pipeline-card">
          <h6 class="fw-bold text-dark m-0">${company}</h6>
          <p class="text-secondary fs-7 m-0 mt-1 mb-3">${contact}</p>
          <div class="d-flex justify-content-between align-items-center fw-semibold">
            <span class="text-dark">$${value}</span>
            <span class="text-brand fs-7">Website</span>
          </div>
        </div>
      `;
      const newColumn = document.getElementById('pipeline-new-col');
      if (newColumn) {
        newColumn.insertAdjacentHTML('beforeend', newDealHtml);
      }
      const countSpan = newColumn.querySelector('.text-secondary.small');
      if (countSpan) {
        countSpan.textContent = parseInt(countSpan.textContent || '0') + 1;
      }
      document.getElementById('dealForm').reset();
      const modal = bootstrap.Modal.getInstance(document.getElementById('newDealModal'));
      if (modal) modal.hide(); 
      showAlert('New deal added to pipeline!', 'success');
    }
    function showAlert(message, type) {
      const container = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type} alert-dismissible fade show shadow-sm mb-4`;
      alert.role = 'alert';
      alert.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      `;
      container.appendChild(alert);
      setTimeout(() => {
        const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
        bsAlert.close();
      }, 3000);
    }
    function addAutomation(event) {
      event.preventDefault();
      const name = document.getElementById('automationName').value;
      const desc = document.getElementById('automationDesc').value;
      const newAutoHtml = `
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mt-3">
          <div>
            <h6 class="fw-bold m-0 text-dark mb-1">${name}</h6>
            <span class="text-secondary fs-7">${desc}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center min-w-150">
            <span class="text-secondary fw-semibold fs-7">Draft</span>
            <span class="text-secondary fs-7">&mdash;</span>
          </div>
        </div>
      `;
      const container = document.getElementById('automations-list-container');
      if (container) container.insertAdjacentHTML('afterbegin', newAutoHtml);
      document.getElementById('automationForm').reset();
      const modal = bootstrap.Modal.getInstance(document.getElementById('newAutomationModal'));
      if (modal) modal.hide();
      showAlert('Automation drafted successfully.', 'info');
    }
    function addTeamMember(event) {
      event.preventDefault();
      const name = document.getElementById('memberName').value;
      const role = document.getElementById('memberRole').value;
      const newMemberHtml = `
        <div class="row align-items-center border-bottom pb-2 mt-2">
          <div class="col-5 fw-bold fs-7 text-dark">${name}</div>
          <div class="col-4 fs-7 text-secondary">${role}</div>
          <div class="col-3 text-end fs-7 text-warning">Pending</div>
        </div>
      `;
      const container = document.getElementById('team-members-container');
      if (container) container.insertAdjacentHTML('afterbegin', newMemberHtml);
      document.getElementById('inviteForm').reset();
      const modal = bootstrap.Modal.getInstance(document.getElementById('inviteMemberModal'));
      if (modal) modal.hide();
      showAlert('Invitation sent successfully.', 'success');
    }
    document.addEventListener('click', function(e) {
      const subNavItem = e.target.closest('.sub-nav-item');
      if (subNavItem) {
        // Find siblings
        const parent = subNavItem.parentElement;
        parent.querySelectorAll('.sub-nav-item').forEach(el => {
          el.classList.remove('active');
          const span = el.querySelector('span');
          if (span && span.classList.contains('fw-semibold')) {
            span.classList.remove('fw-semibold');
            span.classList.add('text-dark');
          }
        });
        subNavItem.classList.add('active');
        const span = subNavItem.querySelector('span');
        if (span && parent.closest('#settingsView')) {
           span.classList.remove('text-dark');
           span.classList.add('fw-semibold');
        }
      }
      // Handle integration pills
      const pill = e.target.closest('#integrationsView .btn');
      if (pill) {
        const parent = pill.parentElement;
        parent.querySelectorAll('.btn').forEach(el => {
          el.classList.remove('text-brand', 'fw-semibold');
          el.classList.add('text-secondary');
        });
        pill.classList.remove('text-secondary');
        pill.classList.add('text-brand', 'fw-semibold');
      }
    });
  </script>
