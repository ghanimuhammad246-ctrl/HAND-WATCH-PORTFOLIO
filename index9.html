<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span in Html</title>
</head>
<style>
    .note{
        font-size: 120%;
        color: brown;
    }
</style>
<body>
    <h1>MY <span class="note">Important</span> Heading</h1>
    <p>This is some <span class="note">Important</span> text.</p>
</body>
</html>
