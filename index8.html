<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Attribute</title>
</head>
<style>
    .city{
        background-color: antiquewhite;
        color: black;
        border: 2px solid red;
        margin: 20px;
        padding: 20px;
    }
    .ghani{
        background-color: black;
        color: white;
        border: 2px solid gray;
        margin: 20px;
        padding: 20px;
    }
    .Jannat{
        background-color: greenyellow;
        color: black;
        border: 2px solid gray;
        margin: 20px;
        padding: 20px;
    }
</style>
<body>
    <div class="city">
        <h2>LONDON</h2>
        <p>LONDON IS THE CAPITAL OF ENGLAND</p>
    </div>
    <div class="ghani">
        <h2>GHANI</h2>
        <p>GHANI IS THE NAME OF ALLAH</p>
    </div>
    <div class="Jannat">
        <h2>JANNAT</h2>
        <p>JANNAT IS THE GIFT OF ALLAH</p>
    </div>
</body>
</html>
